name: Test public engine
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Verify installed wheel and workspace workflow steps
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/quantitera-wheel"
          python -m venv "$RUNNER_TEMP/quantitera-installed"
          engine_python="$RUNNER_TEMP/quantitera-installed/bin/python"
          "$engine_python" -m pip install "$RUNNER_TEMP/quantitera-wheel/"*.whl
          cd "$RUNNER_TEMP"
          "$engine_python" -I -m research_engine init --workspace workspace-smoke
          cd workspace-smoke
          test -f .github/workflows/research.yml
          test -f .gitattributes
          git init -b main
          git config user.name 'quantitera-test'
          git config user.email 'quantitera-test@users.noreply.github.com'
          git add .
          git commit -m "Initialize synthetic blank workspace"
          git clone . ../workspace-clone
          cd ../workspace-clone
          "$engine_python" -I -m research_engine refresh --workspace .
          git add data/events exports outbox
          test -f exports/current_state.json
          test -f exports/research_performance.md
          test -f exports/live_portfolio_performance.json
          test -f exports/shareable/live_portfolio_performance.md
          "$engine_python" -I -m research_engine discuss --workspace . --asset demo
          cd "$RUNNER_TEMP"
          cp -R "$GITHUB_WORKSPACE/examples" ./examples
          "$engine_python" -I -c "import research_engine; assert 'site-packages' in research_engine.__file__"
          "$engine_python" -m examples.research_demo --workspace tutorial-workspace
          cd tutorial-workspace
          "$engine_python" -m research_engine portfolio --workspace . --as-of '2026-01-06T12:05:00+08:00'
          "$engine_python" -m research_engine refresh --workspace . --as-of '2026-01-06T12:05:00+08:00'
          test -f exports/tutorial/research_report.md
          cd "$RUNNER_TEMP"
          "$engine_python" -m examples.performance_demo --workspace performance-workspace

  publish-prepared-release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify and publish the existing v0.5.0 draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import io
          import tarfile
          import zipfile
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request

          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirect = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if urllib.parse.urlparse(newurl).hostname != "api.github.com":
                      redirect.remove_header("Authorization")
                  return redirect

          opener = urllib.request.build_opener(SafeRedirect())
          api = "https://api.github.com/repos/wysking/quantitera"
          accepted = "c22fe0bc04c1432641741bfc2e8862cf617fd379"
          expected = {
              "quantitera-0.5.0-py3-none-any.whl": "23c1dcc2e7362746bcaf6fbb6e1c6db20a7be603b8f1ffd89507a057a4c7bfa9",
              "quantitera-0.5.0.tar.gz": "7f0db8faaaa72e5607241811fa7a075583798a9907bad6acad48c21d012acc31",
              "SHA256SUMS": "43ae86db7587a3903261ab0b81f63257e63c85cf2ccf5da013afed39cc4a1c57",
          }
          def request(path, payload=None, binary=False):
              headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                         "Accept": "application/octet-stream" if binary else "application/vnd.github+json",
                         "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"}
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(api + path, data=data, headers=headers,
                                           method="GET" if payload is None else "PATCH")
              with opener.open(req, timeout=60) as response:
                  value = response.read()
              return value if binary else json.loads(value)

          release = request("/releases/418229400")
          assert release["tag_name"] == "v0.5.0"
          assert release["target_commitish"] == accepted and not release["prerelease"]
          tag = subprocess.check_output(["git", "rev-parse", "v0.5.0^{commit}"], text=True).strip()
          assert tag == accepted, "Accepted tag moved; do not publish"
          if not release["draft"]:
              print("The verified v0.5.0 release is already published:", release["html_url"])
              raise SystemExit(0)
          changed = subprocess.check_output(["git", "diff", "--name-only", accepted, "HEAD"], text=True).splitlines()
          assert set(changed) <= {".github/workflows/ci.yml"}, "Release source differs from accepted source"
          assets = {item["name"]: item for item in release["assets"]}
          assert set(assets) == set(expected), "Prepared release attachment set changed"
          contents = {}
          for name, sha in expected.items():
              asset = assets[name]
              assert asset["state"] == "uploaded" and asset["digest"] == "sha256:" + sha
              contents[name] = request("/releases/assets/" + str(asset["id"]), binary=True)
              assert hashlib.sha256(contents[name]).hexdigest() == sha, name + " checksum mismatch"
          sums = {name: sha for sha, name in (line.split() for line in contents["SHA256SUMS"].decode().splitlines())}
          assert sums == {name: sha for name, sha in expected.items() if name != "SHA256SUMS"}
          tracked = set(subprocess.check_output(["git", "ls-tree", "-r", "--name-only", accepted], text=True).splitlines())
          def same_source(name, value):
              original = subprocess.check_output(["git", "show", accepted + ":" + name])
              assert value.replace(b"\r\n", b"\n") == original.replace(b"\r\n", b"\n"), name + " differs from accepted source"
          with zipfile.ZipFile(io.BytesIO(contents["quantitera-0.5.0-py3-none-any.whl"])) as wheel:
              for name in wheel.namelist():
                  if name.endswith("/"):
                      continue
                  assert name.startswith(("research_engine/", "quantitera-0.5.0.dist-info/")), name
                  if name.startswith("research_engine/"):
                      assert name in tracked, "Untracked wheel source: " + name
                      same_source(name, wheel.read(name))
              same_source("LICENSE", wheel.read("quantitera-0.5.0.dist-info/licenses/LICENSE"))
          with tarfile.open(fileobj=io.BytesIO(contents["quantitera-0.5.0.tar.gz"]), mode="r:gz") as source:
              for item in source.getmembers():
                  if item.isdir():
                      continue
                  assert item.isfile() and item.name.startswith("quantitera-0.5.0/"), item.name
                  name = item.name.removeprefix("quantitera-0.5.0/")
                  assert name in tracked or name in {"PKG-INFO", "setup.cfg"} or name.startswith("quantitera.egg-info/"), name
                  if name in tracked:
                      same_source(name, source.extractfile(item).read())
          print("Original wheel and sdist match accepted tracked sources; no private paths.")
          body = release["body"].replace(
              "此 Release 先保存为发布准备草稿；默认分支合并与正式发布状态须分别核对。",
              "整体验收 PR 已合并 main；本 Release 在 main CI 通过并核对固定 tag 与原附件 SHA256 后正式发布。")
          published = request("/releases/418229400", {"draft": False, "body": body})
          assert not published["draft"] and published["published_at"] and published["tag_name"] == "v0.5.0"
          print("Published existing verified release:", published["html_url"])
          PY
