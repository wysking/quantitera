name: Test public engine
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Verify installed wheel and workspace workflow steps
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/quantitera-wheel"
          python -m venv "$RUNNER_TEMP/quantitera-installed"
          engine_python="$RUNNER_TEMP/quantitera-installed/bin/python"
          "$engine_python" -m pip install "$RUNNER_TEMP/quantitera-wheel/"*.whl
          cd "$RUNNER_TEMP"
          "$engine_python" -I -m research_engine init --workspace workspace-smoke
          cd workspace-smoke
          test -f .github/workflows/research.yml
          test -f .gitattributes
          git init -b main
          git config user.name 'quantitera-test'
          git config user.email 'quantitera-test@users.noreply.github.com'
          git add .
          git commit -m "Initialize synthetic blank workspace"
          git clone . ../workspace-clone
          cd ../workspace-clone
          "$engine_python" -I -m research_engine refresh --workspace .
          git add data/events exports outbox
          test -f exports/current_state.json
          test -f exports/research_performance.md
          test -f exports/live_portfolio_performance.json
          test -f exports/shareable/live_portfolio_performance.md
          "$engine_python" -I -m research_engine discuss --workspace . --asset demo
          cd "$RUNNER_TEMP"
          cp -R "$GITHUB_WORKSPACE/examples" ./examples
          "$engine_python" -I -c "import research_engine; assert 'site-packages' in research_engine.__file__"
          "$engine_python" -m examples.research_demo --workspace tutorial-workspace
          cd tutorial-workspace
          "$engine_python" -m research_engine portfolio --workspace . --as-of '2026-01-06T12:05:00+08:00'
          "$engine_python" -m research_engine refresh --workspace . --as-of '2026-01-06T12:05:00+08:00'
          test -f exports/tutorial/research_report.md
          cd "$RUNNER_TEMP"
          "$engine_python" -m examples.performance_demo --workspace performance-workspace
