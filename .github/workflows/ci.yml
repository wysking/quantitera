name: Test public engine
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Verify installed wheel and workspace workflow steps
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/quantitera-wheel"
          python -m venv "$RUNNER_TEMP/quantitera-installed"
          engine_python="$RUNNER_TEMP/quantitera-installed/bin/python"
          "$engine_python" -m pip install "$RUNNER_TEMP/quantitera-wheel/"*.whl
          cd "$RUNNER_TEMP"
          "$engine_python" -I -m research_engine init --workspace workspace-smoke
          cd workspace-smoke
          test -f .github/workflows/research.yml
          git init -b main
          git config user.name 'quantitera-test'
          git config user.email 'quantitera-test@users.noreply.github.com'
          git add .
          git commit -m "Initialize synthetic blank workspace"
          git clone . ../workspace-clone
          cd ../workspace-clone
          "$engine_python" -I -m research_engine refresh --workspace .
          git add data/events exports outbox
          test -f exports/current_state.json
          "$engine_python" -I -m research_engine discuss --workspace . --asset demo
