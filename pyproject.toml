[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitera"
version = "0.4.0"
description = "Economic mechanism research, due validation and knowledge feedback"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
quantitera = "research_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["research_engine*"]

[tool.setuptools.package-data]
research_engine = ["*.json", "workspace_template/**/*", "workspace_template/.gitignore", "workspace_template/.gitattributes", "workspace_template/.github/workflows/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
