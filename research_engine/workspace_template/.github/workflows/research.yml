name: Private research workspace
on:
  push:
    branches: [main]
    paths: ['inbox/*.json', 'inputs/**', 'config/**']
  schedule:
    - cron: '15 5 * * 1-6'
    - cron: '15 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: quantitera-workspace
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
      - run: python -m pip install 'git+https://github.com/wysking/quantitera.git@v0.5.0'
      - run: python -m research_engine refresh --workspace .
      - name: Save private research state
        run: |
          git config user.name 'quantitera-bot'
          git config user.email 'quantitera-bot@users.noreply.github.com'
          git add data/events exports outbox
          if ! git diff --cached --quiet; then
            git commit -m "Refresh research reviews and feedback"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              git pull --rebase origin main
            done
            test "$pushed" = true
          fi
