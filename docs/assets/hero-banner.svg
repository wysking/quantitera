<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="QuantItera — AI agent that validates its own predictions">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A12"/>
      <stop offset="50%" stop-color="#0A1326"/>
      <stop offset="100%" stop-color="#07192B"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="22%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#060A12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="76%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#060A12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.75"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base card -->
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowLeft)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowRight)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="url(#accent)" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Left column: Brand & Positioning -->
  <rect x="60" y="38" width="128" height="3" rx="1.5" fill="url(#accent)"/>

  <g transform="translate(60, 54)">
    <rect width="268" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#2DD4BF" filter="url(#softGlow)"/>
    <text x="30" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#BAE6FD">OPEN QUANT RESEARCH ENGINE</text>
  </g>

  <text x="58" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC">Quant<tspan fill="url(#accent)">Itera</tspan></text>

  <text x="60" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20.5" font-weight="700" fill="#38BDF8">AI agent that validates its own predictions</text>
  <text x="60" y="216" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16.5" font-weight="600" fill="#E2E8F0">开放式自主迭代量化研究引擎 · <tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" letter-spacing="1.4" fill="#94A3B8">DISCOVER · REASON · VALIDATE · EVOLVE</tspan></text>

  <!-- Bottom feature pills -->
  <g transform="translate(60, 248)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600">
    <rect x="0" y="0" width="122" height="28" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-opacity="0.3"/>
    <text x="61" y="18.5" text-anchor="middle" fill="#E0F2FE">Python 3.12+</text>

    <rect x="132" y="0" width="142" height="28" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#818CF8" stroke-opacity="0.3"/>
    <text x="203" y="18.5" text-anchor="middle" fill="#E0E7FF">ChatGPT &amp; Claude</text>

    <rect x="284" y="0" width="152" height="28" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#2DD4BF" stroke-opacity="0.35"/>
    <text x="360" y="18.5" text-anchor="middle" fill="#CCFBF1">Gemini Native Bridge</text>

    <rect x="446" y="0" width="136" height="28" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#64748B" stroke-opacity="0.4"/>
    <text x="514" y="18.5" text-anchor="middle" fill="#CBD5E1">100% Private Repo</text>
  </g>

  <!-- Right side: Closed-Loop Architecture Mini-Card + Orbit -->
  <g transform="translate(658, 36)">
    <!-- Outer glass panel -->
    <rect x="0" y="0" width="492" height="248" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-opacity="0.24" stroke-width="1.2"/>
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#94A3B8">SELF-VALIDATING RESEARCH LOOP · 4-STAGE ARCHITECTURE</text>
    <line x1="24" y1="42" x2="468" y2="42" stroke="#334155" stroke-opacity="0.6" stroke-width="1"/>

    <!-- 2x2 Stage Cards inside the glass panel -->
    <!-- Stage 1: Discover -->
    <g transform="translate(24, 58)">
      <rect width="212" height="72" rx="10" fill="#0B1120" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="20" cy="22" r="5" fill="#38BDF8"/>
      <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#E0F2FE">1. Discover</text>
      <text x="16" y="46" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#94A3B8">记录原始事件与事前预期</text>
      <text x="16" y="62" font-family="Consolas, monospace" font-size="10.5" fill="#38BDF8">record_evidence · priors</text>
    </g>

    <!-- Stage 2: Reason -->
    <g transform="translate(256, 58)">
      <rect width="212" height="72" rx="10" fill="#0B1120" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="20" cy="22" r="5" fill="#818CF8"/>
      <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#E0E7FF">2. Reason</text>
      <text x="16" y="46" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#94A3B8">推演机制并归档到期条件</text>
      <text x="16" y="62" font-family="Consolas, monospace" font-size="10.5" fill="#A5B4FC">save_decision · review_at</text>
    </g>

    <!-- Stage 3: Validate -->
    <g transform="translate(256, 152)">
      <rect width="212" height="72" rx="10" fill="#0B1120" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="20" cy="22" r="5" fill="#2DD4BF"/>
      <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#CCFBF1">3. Validate</text>
      <text x="16" y="46" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#94A3B8">到期自动对照行情与复盘</text>
      <text x="16" y="62" font-family="Consolas, monospace" font-size="10.5" fill="#5EEAD4">supported / refuted / gaps</text>
    </g>

    <!-- Stage 4: Evolve -->
    <g transform="translate(24, 152)">
      <rect width="212" height="72" rx="10" fill="#0B1120" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="20" cy="22" r="5" fill="#60A5FA"/>
      <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#DBEAFE">4. Evolve</text>
      <text x="16" y="46" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#94A3B8">反驳与经验注入下一轮</text>
      <text x="16" y="62" font-family="Consolas, monospace" font-size="10.5" fill="#93C5FD">discuss · TWR track record</text>
    </g>

    <!-- Connecting Arrows between the 4 stages -->
    <path d="M 238 94 L 254 94" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 362 132 L 362 150" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 254 188 L 238 188" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
    <path d="M 130 150 L 130 132" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
