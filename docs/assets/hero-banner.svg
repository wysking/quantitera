<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="QuantItera — Discover. Reason. Validate. Evolve.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="52%" stop-color="#0C1428"/>
      <stop offset="100%" stop-color="#091C2E"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="22%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="82%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="loopStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base rounded card -->
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowLeft)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowRight)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="19.5" fill="none" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Subtle top accent bar -->
  <rect x="64" y="42" width="132" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Top eyebrow pill -->
  <g transform="translate(64, 58)">
    <rect width="256" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#2DD4BF" filter="url(#softGlow)"/>
    <text x="29" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.8" fill="#BAE6FD">OPEN QUANT RESEARCH ENGINE</text>
  </g>

  <!-- Main Brand Title -->
  <text x="64" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.2" fill="#F8FAFC">Quant<tspan fill="url(#accent)">Itera</tspan></text>

  <!-- Chinese + English tagline -->
  <text x="66" y="198" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#E2E8F0">开放式自主迭代量化研究引擎</text>
  <text x="66" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="1.8" fill="#94A3B8">DISCOVER · REASON · VALIDATE · EVOLVE</text>

  <!-- Bottom feature pills -->
  <g transform="translate(64, 256)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="500">
    <rect x="0" y="0" width="128" height="28" rx="8" fill="#1E293B" fill-opacity="0.72" stroke="#475569" stroke-opacity="0.5"/>
    <text x="64" y="18.5" text-anchor="middle" fill="#CBD5E1">Python 3.12+</text>

    <rect x="140" y="0" width="144" height="28" rx="8" fill="#1E293B" fill-opacity="0.72" stroke="#475569" stroke-opacity="0.5"/>
    <text x="212" y="18.5" text-anchor="middle" fill="#CBD5E1">AI Assistant Native</text>

    <rect x="296" y="0" width="148" height="28" rx="8" fill="#1E293B" fill-opacity="0.72" stroke="#475569" stroke-opacity="0.5"/>
    <text x="370" y="18.5" text-anchor="middle" fill="#CBD5E1">Private Workspace</text>

    <rect x="456" y="0" width="120" height="28" rx="8" fill="#1E293B" fill-opacity="0.72" stroke="#475569" stroke-opacity="0.5"/>
    <text x="516" y="18.5" text-anchor="middle" fill="#CBD5E1">Zero Infra</text>
  </g>

  <!-- Right side iterative research loop emblem -->
  <g transform="translate(945, 160)">
    <!-- Outer subtle orbits -->
    <circle cx="0" cy="0" r="118" fill="none" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="url(#loopStroke)" stroke-width="3" stroke-opacity="0.88" stroke-dasharray="110 28"/>
    <circle cx="0" cy="0" r="54" fill="#0F172A" fill-opacity="0.82" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Center mini sparkline / equity + thesis pulse -->
    <path d="M -28 12 L -14 4 L -2 10 L 12 -10 L 28 -18" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    <circle cx="28" cy="-18" r="3.5" fill="#2DD4BF"/>
    <text x="0" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="1.4" fill="#94A3B8">LOOP</text>

    <!-- 4 Orbit Nodes: Discover / Reason / Validate / Evolve -->
    <!-- Top: Discover -->
    <g transform="translate(0, -88)">
      <rect x="-46" y="-15" width="92" height="30" rx="15" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="0" y="4.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E0F2FE">Discover</text>
    </g>
    <!-- Right: Reason -->
    <g transform="translate(106, 0)">
      <rect x="-42" y="-15" width="84" height="30" rx="15" fill="#0F172A" stroke="#818CF8" stroke-width="1.5"/>
      <text x="0" y="4.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E0E7FF">Reason</text>
    </g>
    <!-- Bottom: Validate -->
    <g transform="translate(0, 88)">
      <rect x="-44" y="-15" width="88" height="30" rx="15" fill="#0F172A" stroke="#2DD4BF" stroke-width="1.5"/>
      <text x="0" y="4.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#CCFBF1">Validate</text>
    </g>
    <!-- Left: Evolve -->
    <g transform="translate(-106, 0)">
      <rect x="-40" y="-15" width="80" height="30" rx="15" fill="#0F172A" stroke="#60A5FA" stroke-width="1.5"/>
      <text x="0" y="4.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#DBEAFE">Evolve</text>
    </g>
  </g>
</svg>
