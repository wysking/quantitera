<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="QuantItera — AI agent that validates its own predictions">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="52%" stop-color="#0C1428"/>
      <stop offset="100%" stop-color="#091C2E"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="22%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="78%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="loopStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base card (1280x640) -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glowLeft)"/>
  <rect width="1280" height="640" fill="url(#glowRight)"/>
  <rect x="24" y="24" width="1232" height="592" rx="24" fill="none" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Subtle top accent bar -->
  <rect x="88" y="88" width="160" height="4" rx="2" fill="url(#accent)"/>

  <!-- Top eyebrow pill -->
  <g transform="translate(88, 114)">
    <rect width="296" height="36" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.38" stroke-width="1.2"/>
    <circle cx="20" cy="18" r="5" fill="#2DD4BF" filter="url(#softGlow)"/>
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1" fill="#BAE6FD">OPEN QUANT RESEARCH ENGINE</text>
  </g>

  <!-- Main Brand Title -->
  <text x="84" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-1.8" fill="#F8FAFC">Quant<tspan fill="url(#accent)">Itera</tspan></text>

  <!-- English primary positioning + Chinese subtitle + 4-stage loop motto -->
  <text x="88" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#38BDF8">AI agent that validates its own predictions</text>
  <text x="88" y="382" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#E2E8F0">开放式自主迭代量化研究引擎</text>
  <text x="88" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="2.4" fill="#94A3B8">DISCOVER · REASON · VALIDATE · EVOLVE</text>

  <!-- Bottom feature pills -->
  <g transform="translate(88, 492)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600">
    <rect x="0" y="0" width="150" height="38" rx="10" fill="#1E293B" fill-opacity="0.78" stroke="#475569" stroke-opacity="0.55"/>
    <text x="75" y="24.5" text-anchor="middle" fill="#CBD5E1">Python 3.12+</text>

    <rect x="166" y="0" width="176" height="38" rx="10" fill="#1E293B" fill-opacity="0.78" stroke="#475569" stroke-opacity="0.55"/>
    <text x="254" y="24.5" text-anchor="middle" fill="#CBD5E1">AI Assistant Native</text>

    <rect x="358" y="0" width="176" height="38" rx="10" fill="#1E293B" fill-opacity="0.78" stroke="#475569" stroke-opacity="0.55"/>
    <text x="446" y="24.5" text-anchor="middle" fill="#CBD5E1">Private Workspace</text>

    <rect x="550" y="0" width="136" height="38" rx="10" fill="#1E293B" fill-opacity="0.78" stroke="#475569" stroke-opacity="0.55"/>
    <text x="618" y="24.5" text-anchor="middle" fill="#CBD5E1">Zero Infra</text>
  </g>

  <!-- Right side iterative research loop emblem (scaled up from hero-banner.svg) -->
  <g transform="translate(995, 320)">
    <circle cx="0" cy="0" r="185" fill="none" stroke="#38BDF8" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle cx="0" cy="0" r="138" fill="none" stroke="url(#loopStroke)" stroke-width="4" stroke-opacity="0.9" stroke-dasharray="172 44"/>
    <circle cx="0" cy="0" r="84" fill="#0F172A" fill-opacity="0.86" stroke="#818CF8" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Center mini sparkline -->
    <path d="M -42 18 L -21 6 L -3 15 L 18 -15 L 42 -27" fill="none" stroke="url(#accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    <circle cx="42" cy="-27" r="5" fill="#2DD4BF"/>
    <text x="0" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#94A3B8">LOOP</text>

    <!-- Top: Discover -->
    <g transform="translate(0, -138)">
      <rect x="-64" y="-21" width="128" height="42" rx="21" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#E0F2FE">Discover</text>
    </g>
    <!-- Right: Reason -->
    <g transform="translate(156, 0)">
      <rect x="-58" y="-21" width="116" height="42" rx="21" fill="#0F172A" stroke="#818CF8" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#E0E7FF">Reason</text>
    </g>
    <!-- Bottom: Validate -->
    <g transform="translate(0, 138)">
      <rect x="-62" y="-21" width="124" height="42" rx="21" fill="#0F172A" stroke="#2DD4BF" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#CCFBF1">Validate</text>
    </g>
    <!-- Left: Evolve -->
    <g transform="translate(-156, 0)">
      <rect x="-56" y="-21" width="112" height="42" rx="21" fill="#0F172A" stroke="#60A5FA" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#DBEAFE">Evolve</text>
    </g>
  </g>
</svg>
