<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="QuantItera — AI agent that validates its own predictions">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A12"/>
      <stop offset="50%" stop-color="#0A1326"/>
      <stop offset="100%" stop-color="#07192B"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="22%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#060A12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="76%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#060A12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.75"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glowLeft)"/>
  <rect width="1280" height="640" fill="url(#glowRight)"/>
  <rect x="24" y="24" width="1232" height="592" rx="24" fill="none" stroke="url(#accent)" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Left column -->
  <rect x="76" y="88" width="156" height="4" rx="2" fill="url(#accent)"/>

  <g transform="translate(76, 114)">
    <rect width="308" height="36" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="20" cy="18" r="5" fill="#2DD4BF" filter="url(#softGlow)"/>
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1" fill="#BAE6FD">OPEN QUANT RESEARCH ENGINE</text>
  </g>

  <text x="72" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-1.8" fill="#F8FAFC">Quant<tspan fill="url(#accent)">Itera</tspan></text>

  <text x="76" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#38BDF8">AI agent that validates its own predictions</text>
  <text x="76" y="382" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="600" fill="#E2E8F0">开放式自主迭代量化研究引擎</text>
  <text x="76" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2.2" fill="#94A3B8">DISCOVER · REASON · VALIDATE · EVOLVE</text>

  <!-- Bottom feature pills -->
  <g transform="translate(76, 496)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">
    <rect x="0" y="0" width="136" height="38" rx="10" fill="#1E293B" fill-opacity="0.82" stroke="#38BDF8" stroke-opacity="0.35"/>
    <text x="68" y="24.5" text-anchor="middle" fill="#E0F2FE">Python 3.12+</text>

    <rect x="148" y="0" width="158" height="38" rx="10" fill="#1E293B" fill-opacity="0.82" stroke="#818CF8" stroke-opacity="0.35"/>
    <text x="227" y="24.5" text-anchor="middle" fill="#E0E7FF">ChatGPT &amp; Claude</text>

    <rect x="318" y="0" width="172" height="38" rx="10" fill="#1E293B" fill-opacity="0.82" stroke="#2DD4BF" stroke-opacity="0.4"/>
    <text x="404" y="24.5" text-anchor="middle" fill="#CCFBF1">Gemini Native Bridge</text>

    <rect x="502" y="0" width="152" height="38" rx="10" fill="#1E293B" fill-opacity="0.82" stroke="#64748B" stroke-opacity="0.45"/>
    <text x="578" y="24.5" text-anchor="middle" fill="#CBD5E1">100% Private Repo</text>
  </g>

  <!-- Right side 4-stage architecture card -->
  <g transform="translate(756, 114)">
    <rect x="0" y="0" width="456" height="420" rx="20" fill="url(#cardGrad)" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1.5"/>
    <text x="28" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#94A3B8">SELF-VALIDATING LOOP · 4-STAGE ARCHITECTURE</text>
    <line x1="28" y1="58" x2="428" y2="58" stroke="#334155" stroke-opacity="0.7" stroke-width="1"/>

    <!-- Stage 1 -->
    <g transform="translate(28, 86)">
      <rect width="190" height="132" rx="14" fill="#0B1120" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="24" cy="30" r="6" fill="#38BDF8"/>
      <text x="40" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#E0F2FE">1. Discover</text>
      <text x="20" y="70" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="#CBD5E1">记录原始事件与事前预期</text>
      <text x="20" y="102" font-family="Consolas, monospace" font-size="12.5" fill="#38BDF8">record_evidence</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(238, 86)">
      <rect width="190" height="132" rx="14" fill="#0B1120" stroke="#818CF8" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="24" cy="30" r="6" fill="#818CF8"/>
      <text x="40" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#E0E7FF">2. Reason</text>
      <text x="20" y="70" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="#CBD5E1">推演机制并归档到期条件</text>
      <text x="20" y="102" font-family="Consolas, monospace" font-size="12.5" fill="#A5B4FC">save_decision</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(238, 246)">
      <rect width="190" height="132" rx="14" fill="#0B1120" stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="24" cy="30" r="6" fill="#2DD4BF"/>
      <text x="40" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#CCFBF1">3. Validate</text>
      <text x="20" y="70" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="#CBD5E1">到期自动对照行情与复盘</text>
      <text x="20" y="102" font-family="Consolas, monospace" font-size="12.5" fill="#5EEAD4">supported / refuted</text>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(28, 246)">
      <rect width="190" height="132" rx="14" fill="#0B1120" stroke="#60A5FA" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="24" cy="30" r="6" fill="#60A5FA"/>
      <text x="40" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#DBEAFE">4. Evolve</text>
      <text x="20" y="70" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#CBD5E1">反驳与经验注入下一轮</text>
      <text x="20" y="102" font-family="Consolas, monospace" font-size="12.5" fill="#93C5FD">discuss · TWR report</text>
    </g>

    <!-- Loop connectors -->
    <path d="M 220 152 L 236 152" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 333 220 L 333 244" stroke="#818CF8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 236 312 L 220 312" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 123 244 L 123 220" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
